<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<link rel="stylesheet" type="text/css" href="css/main.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
		<link
			rel="stylesheet"
			href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
			integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
			crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" />
		<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
		<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
			rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500&display=swap"
			rel="stylesheet" />

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	</head>

	<body style="background-color: rgba(0, 0, 0, 0)">
		<div class="container-muerte">
			<div class="zona-muerte">
				<div class="img-muerte">
					<img
						src="./heart.webp"
						style="
							width: 12vh;
							filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.687));
						" />
				</div>
				<div class="titulo-muerte">You are injured!</div>
				<div
					class="zona-tiempo animate__animated animate__pulse animate__infinite animate__slow">
					You will pass out in <span class="tiempo"></span> seconds.
				</div>
				<div
					class="zona-respawn animate__animated animate__pulse animate__infinite animate__slow"
					style="display: none"></div>
			</div>
		</div>

		<div class="ui-container">
			<div class="hud-container">
				<div class="hud">
					<div class="barras">
						<div class="barra chaleco">
							<i
								class="fas fa-shield-alt"
								style="
									position: absolute;
									left: 0.32vh;
									color: white;
									font-size: 0.9vh;
									top: 0.25vh;
								"></i>
							<div class="content-barra"></div>
						</div>
						<div class="barra vida">
							<i
								class="fas fa-heart"
								style="
									position: absolute;
									left: 0.32vh;
									color: white;
									font-size: 0.9vh;
									top: 0.25vh;
								"></i>
							<div class="content-barra"></div>
						</div>
					</div>
				</div>
			</div>
			<div class="ui-bar-container">
				<div class="voz">
					<div class="z-texto">
						<div id="texto-voz">Normal</div>
					</div>
					<div class="bg-voz">
						<img src="https://i.imgur.com/ZLlX2ra.png" id="Susurro" />
						<img src="https://i.imgur.com/DJZhRpU.png" id="Normal" />
						<img src="https://i.imgur.com/Af9uhiA.png" id="Gritar" />
						<img src="https://i.imgur.com/uw0mfU1.png" id="Radio" />
					</div>
				</div>
			</div>
			<div class="ui-car-container">
				<div class="ui-car-speed">
					<div class="speed-text">0</div>
					<div class="speed-type">km/h</div>
				</div>

				<div class="ui-car-fuel">
					<img src="https://i.imgur.com/CbKz5tN.png" class="icon" />
					<div class="fuel-text">100</div>
				</div>
			</div>
		</div>

		<script src="js/app.js" type="text/javascript"></script>
	</body>
</html>
